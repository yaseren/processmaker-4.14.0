name: processmaker

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: processmaker-php:local
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${COMPOSE_APP_URL:-http://localhost:8080}
      SESSION_DOMAIN: ${COMPOSE_SESSION_DOMAIN:-localhost}
      TELESCOPE_ENABLED: "false"
      DB_CONNECTION: processmaker
      DB_HOSTNAME: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${COMPOSE_MYSQL_DATABASE:-processmaker}
      DB_USERNAME: ${COMPOSE_MYSQL_USER:-processmaker}
      DB_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:-processmaker-local}
      DATA_DB_DRIVER: mysql
      DATA_DB_HOST: mysql
      DATA_DB_PORT: "3306"
      DATA_DB_DATABASE: ${COMPOSE_MYSQL_DATABASE:-processmaker}
      DATA_DB_USERNAME: ${COMPOSE_MYSQL_USER:-processmaker}
      DATA_DB_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:-processmaker-local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: predis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      BROADCAST_DRIVER: redis
      BROADCASTER_HOST: ${COMPOSE_BROADCASTER_HOST:-http://localhost:6001}
      BROADCASTER_KEY: ${COMPOSE_BROADCASTER_KEY:-21a795019957dde6bcd96142e05d4b10}
      LARAVEL_ECHO_SERVER_AUTH_HOST: ${COMPOSE_APP_URL:-http://localhost:8080}
      FORCE_HTTPS: "false"
      LARAVEL_ECHO_SERVER_PORT: "6001"
      PROCESSMAKER_SCRIPTS_DOCKER: /usr/bin/docker
      SKIP_EXECUTORS: ${COMPOSE_SKIP_EXECUTORS:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.29-alpine
    ports:
      - "127.0.0.1:${COMPOSE_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${COMPOSE_MYSQL_DATABASE:-processmaker}
      MYSQL_USER: ${COMPOSE_MYSQL_USER:-processmaker}
      MYSQL_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:-processmaker-local}
      MYSQL_ROOT_PASSWORD: ${COMPOSE_MYSQL_ROOT_PASSWORD:-root-local}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  horizon:
    image: processmaker-php:local
    working_dir: /var/www/html
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      TELESCOPE_ENABLED: "false"
      DB_CONNECTION: processmaker
      DB_HOSTNAME: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${COMPOSE_MYSQL_DATABASE:-processmaker}
      DB_USERNAME: ${COMPOSE_MYSQL_USER:-processmaker}
      DB_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:-processmaker-local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: predis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: processmaker-php:local
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/zz-local.ini:ro
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      TELESCOPE_ENABLED: "false"
      DB_CONNECTION: processmaker
      DB_HOSTNAME: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${COMPOSE_MYSQL_DATABASE:-processmaker}
      DB_USERNAME: ${COMPOSE_MYSQL_USER:-processmaker}
      DB_PASSWORD: ${COMPOSE_MYSQL_PASSWORD:-processmaker-local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: predis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  echo:
    image: node:20-alpine
    working_dir: /app
    command: ["npx", "--yes", "laravel-echo-server@1.6.1", "start", "--force"]
    ports:
      - "127.0.0.1:${COMPOSE_ECHO_PORT:-6001}:6001"
    volumes:
      - ./docker/laravel-echo-server.json:/app/laravel-echo-server.json:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /var/www/html
    command: ["sh", "-c", "npm ci && npm run dev"]
    volumes:
      - ./:/var/www/html
    profiles:
      - tools

volumes:
  mysql-data:
